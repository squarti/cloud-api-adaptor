# Make the image bootable with legacy BIOS (e.g. IBM Cloud gen-2 profiles such
# as bx2/bx2d only support BIOS). Intended for non-confidential deployments
# (TEE_PLATFORM=none, DISABLECVM=true). Combine with another profile:
#   --profile production,bios   or   --profile debug,bios
#
# Differences from the default (UEFI) image:
#   - grub boots the kernel; no UKI, no measured boot.
#   - Root partition is ext4 (read-write), not squashfs + dm-verity.
#   - systemd.volatile=state is not set; /etc and the full root are writable.
#   - console=ttyS0 replaced with console=tty0 (serial device absent on bx2/bx2d).
#
# Do not use this profile for confidential or attested deployments.

[Content]
BiosBootloader=grub
Packages=grub-pc-bin
# BIOS VMs (e.g. IBM Cloud bx2/bx2d) are watched through a VGA (VNC) console.
# Reset the list from mkosi.conf and re-add everything, replacing console=ttyS0
# with console=tty0 (ttyS0 may not exist and causes a 90s systemd timeout).
KernelCommandLine=
KernelCommandLine=console=tty0
KernelCommandLine=systemd.firstboot=off
KernelCommandLine=selinux=0 enforcing=0 audit=0
KernelCommandLine=initcall_blacklist=vmgenid_plaform_driver_init

[Output]
# Reset the list to drop the default mkosi.repart and use the BIOS variant.
RepartDirectories=
RepartDirectories=mkosi.repart-bios
