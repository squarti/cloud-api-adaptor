# Make the image bootable with legacy BIOS in addition to UEFI (e.g. IBM Cloud
# gen-2 profiles such as bx2/bx2d only boot BIOS). Combine with another
# profile: --profile production,bios
#
# The UKI is still built and used under UEFI. Under BIOS, grub loads the kernel
# and initrd (type1 entries) from the ESP, with the same kernel command line
# (dm-verity roothash included).
#
# Without the UKI the BIOS boot path is not covered by UKI-based measured boot,
# so do not use this profile where that guarantee is required.

[Content]
BiosBootloader=grub
Packages=grub-pc-bin
# BIOS VMs are usually watched through a VGA (VNC) console, and grub is silent
# (timeout=0). Log to VGA as well as the serial port (ttyS0 from mkosi.conf).
# The last console= is the primary one, which is tty0 here.
KernelCommandLine=console=tty0

[Output]
# Reset the list to drop the default mkosi.repart and use the BIOS variant.
RepartDirectories=
RepartDirectories=mkosi.repart-bios
